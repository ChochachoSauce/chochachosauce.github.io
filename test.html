<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>90s Corporate Desktop Simulation</title>
<style>
/* ===== GLOBAL STYLES ===== */
body {
    margin: 0;
    height: 100vh;
    font-family: "MS Sans Serif", Tahoma, sans-serif;
    overflow: hidden;
    user-select: none;

    background-image:
        repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0 10px, rgba(0,0,0,0.02) 10px 20px),
        linear-gradient(270deg, purple, slategray);
    background-size: 32px 32px, 400% 400%;
    animation: pulseGradient 20s ease-in-out infinite;
}

@keyframes pulseGradient {
    0% { background-position: 0 0, 0 0; }
    50% { background-position: 0 0, 100% 50%; }
    100% { background-position: 0 0, 0 0; }
}

/* ===== LOGIN SCREEN ===== */
#loginScreen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
    opacity: 1;
    transition: opacity 1s ease;
}

.login-container {
    width: 350px;
    padding: 40px 30px;
    background: linear-gradient(to bottom, #c0c0c0, #a0a0a0);
    border: 2px solid #000;
    box-shadow: inset -2px -2px #fff, inset 2px 2px #808080;
    text-align: center;
    border-radius: 4px;
}

.login-logo {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 20px;
    color: #004080;
    text-shadow: 1px 1px #fff;
}

.login-container input {
    width: 90%;
    padding: 8px;
    margin: 10px 0;
    border: 2px solid #000;
    box-shadow: inset -1px -1px #fff, inset 1px 1px #808080;
    font-family: inherit;
    font-size: 14px;
}

.login-container button {
    width: 95%;
    padding: 10px;
    margin-top: 20px;
    background: linear-gradient(to bottom, #808080, #c0c0c0);
    border: 2px solid #000;
    box-shadow: inset -1px -1px #fff, inset 1px 1px #808080;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    color: #000;
}

.login-container button:active {
    box-shadow: inset 1px 1px #808080, inset -1px -1px #fff;
}

/* ===== DESKTOP ===== */
#desktop {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    opacity: 0;
    transition: opacity 1s ease;
}

/* ===== DESKTOP ICONS ===== */
.desktop {
    position: absolute;
    top: 16px;
    left: 16px;
}

.icon {
    width: 72px;
    margin-bottom: 24px;
    text-align: center;
    color: white;
    font-size: 11px;
    cursor: default;
}

.icon.selected {
    background: #000080;
}

.icon .ico {
    width: 32px;
    height: 32px;
    margin: 0 auto 4px;
    border: 1px solid #fff;
}

/* Assign unique colors for icons */
.icon[data-win="w1"] .ico { background:#ffcc00; }
.icon[data-win="w2"] .ico { background:#00ccff; }
.icon[data-win="w3"] .ico { background:#ff66cc; }

/* ===== WINDOWS ===== */
.window {
    position: absolute;
    background: #c0c0c0;
    border: 2px solid #000;
    box-shadow: inset -1px -1px #808080, inset 1px 1px #fff;
    display: none;
}

.titlebar {
    height: 22px;
    background: #000080;
    color: white;
    font-weight: bold;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px;
    cursor: move;
}

.titlebar .title {
    display: flex;
    align-items: center;
}

.win-icon {
    display:inline-block;
    width:16px; height:16px;
    border:1px solid #000;
    margin-right:4px;
    vertical-align:middle;
}

.sysbuttons button {
    width: 16px;
    height: 14px;
    margin-left: 2px;
    font-size: 10px;
    padding: 0;
    background: #c0c0c0;
    border: 1px solid #000;
    box-shadow: inset -1px -1px #808080, inset 1px 1px #ffffff;
}

.sysbuttons button:active {
    box-shadow: inset 1px 1px #808080, inset -1px -1px #ffffff;
}

.content {
    padding: 12px;
    font-size: 12px;
    text-align: center;
}

.btn {
    margin-top: 10px;
    padding: 4px 14px;
    background: #c0c0c0;
    border: 2px solid #000;
    box-shadow: inset -1px -1px #808080, inset 1px 1px #ffffff;
}

.btn:active {
    box-shadow: inset 1px 1px #808080, inset -1px -1px #ffffff;
}

input, textarea {
    width: 90%;
    font-family: inherit;
    margin: 4px 0;
}

/* ===== CURSOR GLITTER ===== */
.spark {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #fff;
    opacity: 0.8;
    pointer-events: none;
    animation: sparkfade 0.7s linear forwards;
}

@keyframes sparkfade {
    to { opacity: 0; transform: scale(2); }
}

/* ===== TASKBAR ===== */
.taskbar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 32px;
    background: #c0c0c0;
    border-top: 2px solid #000;
    display: flex;
    align-items: center;
    padding: 0 4px;
}

.start-button {
    width: 60px;
    height: 28px;
    background: #c0c0c0 url('https://i.imgur.com/F5hKswl.png') no-repeat center center;
    background-size: contain;
    border: 2px solid #000;
    margin-right: 4px;
    cursor: pointer;
    box-shadow: inset -1px -1px #808080, inset 1px 1px #ffffff;
}

.start-button:active {
    box-shadow: inset 1px 1px #808080, inset -1px -1px #ffffff;
}

.taskbar-windows {
    display: flex;
    gap: 4px;
}
.taskbar-windows .tbwin {
    padding: 2px 6px;
    background: #c0c0c0;
    border: 2px solid #000;
    font-size: 11px;
    cursor: pointer;
    box-shadow: inset -1px -1px #808080, inset 1px 1px #ffffff;
    display:flex;
    align-items:center;
}
.taskbar-windows .tbwin .tb-icon {
    width:12px; height:12px;
    border:1px solid #000;
    margin-right:4px;
}
.taskbar-windows .tbwin:active {
    box-shadow: inset 1px 1px #808080, inset -1px -1px #ffffff;
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
    <div class="login-container">
        <div class="login-logo">Fate Engine</div>
        <form id="loginForm">
            <input type="text" name="username" placeholder="Username" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <button type="submit">Click Here to Enter</button>
        </form>
    </div>
</div>

<!-- DESKTOP -->
<div id="desktop">
    <div class="desktop">
        <div class="icon" data-win="w1"><div class="ico"></div>Free Advice</div>
        <div class="icon" data-win="w2"><div class="ico"></div>Low Cost</div>
        <div class="icon" data-win="w3"><div class="ico"></div>Sliding Scale</div>
    </div>

    <!-- PROGRAM WINDOWS -->
    <div class="window" id="w1" style="top:120px; left:300px; width:300px;">
        <div class="titlebar">
            <div class="title"><div class="win-icon" style="background:#ffcc00"></div>Free Advice</div>
            <div class="sysbuttons"><button onclick="hideWin(this)">_</button><button onclick="closeWin(this)">X</button></div>
        </div>
        <div class="content">Line 1<br>Line 2<br>Line 3<br>Line 4<br><button class="btn" onclick="openSurvey()">OK</button></div>
    </div>
    <div class="window" id="w2" style="top:160px; left:520px; width:300px;">
        <div class="titlebar">
            <div class="title"><div class="win-icon" style="background:#00ccff"></div>Low Cost</div>
            <div class="sysbuttons"><button onclick="hideWin(this)">_</button><button onclick="closeWin(this)">X</button></div>
        </div>
        <div class="content">Line 1<br>Line 2<br>Line 3<br>Line 4<br><button class="btn" onclick="openSurvey()">OK</button></div>
    </div>
    <div class="window" id="w3" style="top:260px; left:400px; width:300px;">
        <div class="titlebar">
            <div class="title"><div class="win-icon" style="background:#ff66cc"></div>Sliding Scale</div>
            <div class="sysbuttons"><button onclick="hideWin(this)">_</button><button onclick="closeWin(this)">X</button></div>
        </div>
        <div class="content">Line 1<br>Line 2<br>Line 3<br>Line 4<br><button class="btn" onclick="openSurvey()">OK</button></div>
    </div>

    <!-- SURVEY WINDOW -->
    <div class="window" id="survey" style="top:150px; left:350px; width:520px; height:450px;">
        <div class="titlebar">
            <div class="title"><div class="win-icon" style="background:#66ff66"></div>User Survey</div>
            <div class="sysbuttons"><button onclick="hideWin(this)">_</button><button onclick="closeWin(this)">X</button></div>
        </div>
        <div class="content" style="height:380px; overflow-y:auto; text-align:left;">
            <form id="surveyForm">
                <label>1. Name (Short Answer)</label><br><input type="text" name="name" required><br><br>
                <label>2. Email (Short Answer)</label><br><input type="email" name="email" required><br><br>
                <label>3. Favorite Website (Short Answer)</label><br><input type="text" name="website"><br><br>
                <label>4. What do you like about our service? (Long Answer)</label><br><textarea name="feedback1" rows="3"></textarea><br><br>
                <label>5. What should we improve? (Long Answer)</label><br><textarea name="feedback2" rows="3"></textarea><br><br>
                <label>6. Any additional comments? (Long Answer)</label><br><br><textarea name="feedback3" rows="3"></textarea><br><br>
                <button class="btn" type="submit">Submit & Pay</button>
            </form>
        </div>
    </div>

    <!-- TASKBAR -->
    <div class="taskbar">
        <div class="start-button" title="Start"></div>
        <div class="taskbar-windows" id="taskbarWindows"></div>
    </div>
</div>

<script>
/* ===== LOGIN TRANSITION ===== */
document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    const login = document.getElementById('loginScreen');
    const desktop = document.getElementById('desktop');
    login.style.opacity = 0;
    setTimeout(()=> login.style.display='none', 1000);
    desktop.style.display = 'flex';
    setTimeout(()=> desktop.style.opacity=1, 50);
});

/* ===== ICON LOGIC ===== */
let lastClick = 0;
document.querySelectorAll('.icon').forEach(icon => {
    icon.addEventListener('click', e => {
        document.querySelectorAll('.icon').forEach(i => i.classList.remove('selected'));
        icon.classList.add('selected');

        const now = Date.now();
        if (now - lastClick < 400 && icon.dataset.win) { showWin(icon.dataset.win); }
        lastClick = now;
        e.stopPropagation();
    });
});
document.body.addEventListener('click', () => document.querySelectorAll('.icon').forEach(i => i.classList.remove('selected')));

/* ===== WINDOW FUNCTIONS ===== */
function showWin(id){ const win = document.getElementById(id); win.style.display='block'; focusWin(win); addTaskbarButton(win);}
function closeWin(btn){ const win = btn.closest('.window'); win.style.display='none'; removeTaskbarButton(win);}
function hideWin(btn){ const win = btn.closest('.window'); win.style.display='none';}
function openSurvey(){ showWin('survey'); }
function focusWin(win){ document.querySelectorAll('.window').forEach(w => w.classList.remove('active')); win.classList.add('active');}

/* ===== DRAGGING ===== */
let dragWin=null,dx=0,dy=0;
document.querySelectorAll('.titlebar').forEach(bar=>{bar.addEventListener('mousedown', e=>{dragWin=bar.parentElement; dx=e.clientX-dragWin.offsetLeft; dy=e.clientY-dragWin.offsetTop; focusWin(dragWin);});});
document.addEventListener('mousemove', e=>{if(!dragWin) return; dragWin.style.left=e.clientX-dx+'px'; dragWin.style.top=e.clientY-dy+'px';});
document.addEventListener('mouseup', ()=> dragWin=null);

/* ===== CURSOR GLITTER ===== */
document.addEventListener('mousemove', e=>{ const s=document.createElement('div'); s.className='spark'; s.style.left=e.pageX+'px'; s.style.top=e.pageY+'px'; document.body.appendChild(s); setTimeout(()=>s.remove(),700); });

/* ===== SURVEY SUBMIT ===== */
document.getElementById('surveyForm').addEventListener('submit', function(e){
    e.preventDefault();
    window.open('https://www.paypal.com/paypalme/YOURPAYPALUSERNAME','_blank');
    alert("Thank you! You will now be redirected to PayPal to complete payment.");
    document.getElementById('survey').style.display='none';
});

/* ===== TASKBAR BUTTONS ===== */
function addTaskbarButton(win){
    const tb=document.getElementById('taskbarWindows');
    if(!document.getElementById('tb_'+win.id)){
        const btn=document.createElement('div'); 
        btn.className='tbwin'; 
        btn.id='tb_'+win.id;

        const icon = win.querySelector('.win-icon').cloneNode(true);
        icon.classList.add('tb-icon');
        btn.appendChild(icon);

        const text = document.createTextNode(win.querySelector('.title').textContent);
        btn.appendChild(text);

        btn.onclick=()=>{win.style.display='block'; focusWin(win);};
        tb.appendChild(btn);
    }
}
function removeTaskbarButton(win){ const btn=document.getElementById('tb_'+win.id); if(btn) btn.remove(); }
</script>
</body>
</html>
